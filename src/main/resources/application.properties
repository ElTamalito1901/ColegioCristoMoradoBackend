# ========================================
# CONEXIÓN A POSTGRESQL
# ========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/colegiocristomorado
spring.datasource.username=postgres
spring.datasource.password=alianzalima

# Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver


# ========================================
# JPA / HIBERNATE
# ========================================

# Mantiene la estructura de las tablas existente
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true

# Formatear las consultas SQL
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ========================================
# SERVIDOR
# ========================================

server.port=8080


